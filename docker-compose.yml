# =============================================================================
# News Media Big Data Platform — Docker Compose
# Services: MinIO · PostgreSQL · Zookeeper · Kafka · Scraper · Airflow · Metabase
# =============================================================================

x-airflow-common: &airflow-common
  image: apache/airflow:2.8.1
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: "R46yQ8e9c7Vu3EqPXmJNkTs5ALZDoGHb2wfOIiCr0BM="
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://scrap_user:scrap_pass@postgres:5432/scrap_dw
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
    DATABASE_URL: "postgresql://scrap_user:scrap_pass@postgres:5432/scrap_dw"
    MINIO_ENDPOINT: "minio:9000"
    MINIO_ACCESS_KEY: "minioadmin"
    MINIO_SECRET_KEY: "minioadmin"
    KAFKA_BROKER: "kafka:9092"
    KAFKA_TOPIC: "news"
    PYTHONPATH: "/app"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - .:/app
    - news_data:/app/data
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ---------------------------------------------------------------------------
  # Data Lake — MinIO (S3-compatible object store)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-03-15T01-07-19Z
    container_name: news_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # MinIO bucket initialiser (runs once)
  minio_init:
    image: minio/mc:latest
    container_name: news_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/news-data;
        mc mb --ignore-existing local/news-data/bronze;
        mc mb --ignore-existing local/news-data/silver;
        mc mb --ignore-existing local/news-data/gold;
        echo 'MinIO buckets ready.';
      "
    restart: on-failure

  # ---------------------------------------------------------------------------
  # Data Warehouse — PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: news_postgres
    environment:
      POSTGRES_USER: scrap_user
      POSTGRES_PASSWORD: scrap_pass
      POSTGRES_DB: scrap_dw
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema_dw.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrap_user -d scrap_dw"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Streaming — Zookeeper + Kafka
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: news_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zk_data:/var/lib/zookeeper
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: news_kafka
    environment:
      KAFKA_BROKER_ID: "1"
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENERS: "PLAINTEXT://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka
    depends_on:
      - zookeeper
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Scraper service (batch mode — also used in Airflow tasks)
  # ---------------------------------------------------------------------------
  scraper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news_scraper
    env_file: .env
    environment:
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      KAFKA_BROKER: "kafka:9092"
      KAFKA_TOPIC: "news"
      PYTHONPATH: "/app"
    depends_on:
      - minio
      - kafka
    volumes:
      - news_data:/app/data
    command: ["python", "src/scraper/scraper.py", "--config", "src/scraper/config.yaml", "--out", "data/bronze"]
    restart: "no"

  # ---------------------------------------------------------------------------
  # Orchestration — Apache Airflow
  # ---------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: news_airflow_init
    command: >
      bash -c "
        airflow db upgrade &&
        airflow users create
          --username admin
          --firstname Admin
          --lastname User
          --role Admin
          --email admin@news-platform.com
          --password admin || true
      "
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: news_airflow_webserver
    command: airflow webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    container_name: news_airflow_scheduler
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Visualisation — Metabase (BI dashboards connected to PostgreSQL)
  # ---------------------------------------------------------------------------
  metabase:
    image: metabase/metabase:latest
    container_name: news_metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: "5432"
      MB_DB_USER: scrap_user
      MB_DB_PASS: scrap_pass
      MB_DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

# =============================================================================
# Named volumes
# =============================================================================
volumes:
  minio_data:
  pgdata:
  zk_data:
  kafka_data:
  news_data:
